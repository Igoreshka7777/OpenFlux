name: iOS WB Stream build

on:
  push:
    branches:
      - codex/igor-vpn-ios-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ios-wb-runtime/go.mod
          cache-dependency-path: ios-wb-runtime/go.sum

      - name: Install iOS project tools
        run: brew install xcodegen

      - name: Test WB runtime
        working-directory: ios-wb-runtime
        run: go test ./...

      - name: Build WB runtime for iOS
        run: bash ./build_ios_wb.sh

      - name: Generate Xcode project and resolve packages
        working-directory: ios-app
        run: |
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project OpenFlux.xcodeproj -scheme OpenFlux

      - name: Compile iPhone app without signing
        working-directory: ios-app
        run: |
          xcodebuild \
            -project OpenFlux.xcodeproj \
            -scheme OpenFlux \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Pack build output
        working-directory: ios-app
        run: |
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Release-iphoneos/OpenFlux.app \
            build/IgorVPN-WBStream-unsigned.app.zip

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: IgorVPN-WBStream-unsigned-iphoneos
          path: ios-app/build/IgorVPN-WBStream-unsigned.app.zip
          if-no-files-found: error
