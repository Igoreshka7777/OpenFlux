name: iOS build check

on:
  push:
    branches:
      - codex/igor-vpn-ios-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check Go packages
        run: go test ./iosroute ./transport/mailru

      - name: Build iOS Go library
        run: ./build_ios.sh

      - name: Generate Xcode project
        run: |
          mkdir -p ios-app/Lib
          cp output/ios/liboflux.a output/ios/liboflux.h ios-app/Lib/
          cd ios-app
          xcodegen generate

      - name: Compile iPhone app without signing
        working-directory: ios-app
        run: |
          xcodebuild \
            -project OpenFlux.xcodeproj \
            -scheme OpenFlux \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Pack build output
        working-directory: ios-app
        run: |
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Release-iphoneos/OpenFlux.app \
            build/IgorVPN-unsigned.app.zip

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: IgorVPN-unsigned-iphoneos
          path: ios-app/build/IgorVPN-unsigned.app.zip
          if-no-files-found: error
